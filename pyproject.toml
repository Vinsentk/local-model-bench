[project]
name = "local-model-bench"
version = "0.2.0"
description = "Windows UI for testing and recommending Ollama local models."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "huggingface_hub>=0.24",
  "pyinstaller>=6.0",
]

[project.scripts]
local-model-bench = "local_model_bench.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
